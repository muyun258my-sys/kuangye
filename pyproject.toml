[project]
name = "mining-briefing"
version = "0.1.0"
description = "矿权日报 Agent：3 个 MCP server（新闻 / PDF 储量 / 价格）+ LangGraph 编排的 Agent client"
readme = "RUN.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.12,<2",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "pdfplumber>=0.11",
    "langgraph>=0.4",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "reportlab>=4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
